<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';" />
  <title>Unlimeety Notes</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;
    }
    .card {
      height: 100%;
      margin: 6px;
      display: flex;
      flex-direction: column;
      background: #1b1b22;
      border: 1px solid #2c2c36;
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      /* let the header be a drag handle; buttons/list/input opt out below */
      -webkit-app-region: drag;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid #2c2c36;
      flex: none;
    }
    .title { font-size: 13px; font-weight: 600; color: #f2f2f5; }
    .header-actions {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .icon-btn {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #9a9aa6;
      cursor: pointer;
    }
    .icon-btn:hover { background: #25252e; color: #f2f2f5; }
    .close-btn { font-size: 14px; line-height: 20px; }
    /* Collapsed: shrink to just the header bar, like the Chrome extension
       widget's collapse toggle — main.js resizes the actual window to match. */
    body.collapsed .list,
    body.collapsed .input-row { display: none; }
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      -webkit-app-region: no-drag;
      -webkit-user-select: text;
      cursor: text;
    }
    .empty {
      color: #6c6c78;
      font-size: 12px;
      padding: 8px 0;
    }
    .note-row {
      display: flex;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #24242c;
      font-size: 12.5px;
      line-height: 1.4;
    }
    .note-row:last-child { border-bottom: none; }
    .note-time {
      flex: none;
      color: #7a8fb0;
      font-variant-numeric: tabular-nums;
    }
    .note-text {
      color: #d6d6dd;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .input-row {
      padding: 8px;
      border-top: 1px solid #2c2c36;
      -webkit-app-region: no-drag;
      flex: none;
    }
    input {
      width: 100%;
      background: #26262f;
      border: 1px solid #34343f;
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 13px;
      color: #f2f2f5;
      outline: none;
    }
    input:focus { border-color: #5a5aef; }
    input::placeholder { color: #6c6c78; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">Notes</div>
      <div class="header-actions">
        <button class="icon-btn" id="collapse-btn" title="Collapse">
          <svg id="icon-collapse" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
          <svg id="icon-expand" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="icon-btn close-btn" id="close-btn" title="Close">×</button>
      </div>
    </div>
    <div class="list" id="list">
      <div class="empty" id="empty">No notes yet — type below and press Enter.</div>
    </div>
    <div class="input-row">
      <input id="input" type="text" placeholder="Note… (Enter to save)" autofocus />
    </div>
  </div>
  <script src="notes.js"></script>
</body>
</html>

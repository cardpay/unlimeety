<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Unlimeety Notes</title>
  <!-- Resolves the shared `uds-theme` preference onto <html data-theme> before
       first paint; panel-theme.css keys its light palette off that attribute. -->
  <script src="../theme-init.js"></script>
  <link rel="stylesheet" href="../panel-theme.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none;
      cursor: default;
      overflow: hidden;
    }
    .card {
      height: 100%;
      margin: 6px;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: var(--panel-shadow);
      overflow: hidden;
      /* let the header be a drag handle; buttons/list/input opt out below */
      -webkit-app-region: drag;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--panel-border);
      flex: none;
    }
    .title { font-size: 13px; font-weight: 600; color: var(--panel-title); }
    .header-actions {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .icon-btn {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--panel-muted);
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--panel-hover); color: var(--panel-title); }
    .close-btn { font-size: 14px; line-height: 20px; }
    /* Collapsed: shrink to just the header bar, like the Chrome extension
       widget's collapse toggle — main.js resizes the actual window to match. */
    body.collapsed .list,
    body.collapsed .input-row { display: none; }
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      -webkit-app-region: no-drag;
      -webkit-user-select: text;
      cursor: text;
    }
    .empty {
      color: var(--panel-dim);
      font-size: 12px;
      padding: 8px 0;
    }
    .note-row {
      display: flex;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--panel-row-border);
      font-size: 12.5px;
      line-height: 1.4;
    }
    .note-row:last-child { border-bottom: none; }
    .note-time {
      flex: none;
      color: var(--panel-note-time);
      font-variant-numeric: tabular-nums;
    }
    .note-text {
      color: var(--panel-note-text);
      word-break: break-word;
      white-space: pre-wrap;
    }
    .input-row {
      padding: 8px;
      border-top: 1px solid var(--panel-border);
      -webkit-app-region: no-drag;
      flex: none;
    }
    input {
      width: 100%;
      background: var(--panel-input-bg);
      border: 1px solid var(--panel-input-border);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 13px;
      color: var(--panel-title);
      outline: none;
    }
    /* The panel is shown with showInactive(), so it is not the key window until
       the user clicks it. `:focus` alone would paint an active-looking ring
       while keystrokes still went to the main window — `:focus-visible` after a
       real click is the honest signal. */
    input:focus-visible { border-color: var(--panel-focus-border); }
    input::placeholder { color: var(--panel-dim); }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">Notes</div>
      <div class="header-actions">
        <button class="icon-btn" id="collapse-btn" title="Collapse">
          <svg id="icon-collapse" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
          <svg id="icon-expand" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="icon-btn close-btn" id="close-btn" title="Close">×</button>
      </div>
    </div>
    <div class="list" id="list">
      <div class="empty" id="empty">No notes yet — type below and press Enter.</div>
    </div>
    <div class="input-row">
      <input id="input" type="text" placeholder="Click here to type a note, Enter to save" />
    </div>
  </div>
  <script src="../notes-list.js"></script>
  <script src="notes.js"></script>
</body>
</html>
